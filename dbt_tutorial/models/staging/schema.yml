version: 2

models:
  - name: stg_top_terms
    description: "Cleaned US top search terms by DMA region and week"
    columns:
      - name: refresh_date
        description: "Date when the data was last refreshed"
      - name: term
        description: "Search term (lowercased)"
      - name: week
        description: "Week of the search trend data"
      - name: trend_score
        description: "Relative popularity score of the term"
      - name: trend_rank
        description: "Rank of the term within its group"
      - name: dma_name
        description: "Designated Market Area name"
      - name: dma_id
        description: "Designated Market Area identifier"

  - name: stg_top_rising_terms
    description: "Cleaned US top rising search terms by DMA region and week"
    columns:
      - name: refresh_date
        description: "Date when the data was last refreshed"
      - name: term
        description: "Search term (lowercased)"
      - name: week
        description: "Week of the search trend data"
      - name: trend_score
        description: "Relative popularity score of the term"
      - name: percent_gain
        description: "Percentage increase in search interest compared to prior period"
      - name: trend_rank
        description: "Rank of the term within its group"
      - name: dma_name
        description: "Designated Market Area name"
      - name: dma_id
        description: "Designated Market Area identifier"

  - name: stg_intl_top_terms
    description: "Cleaned international top search terms by country, region, and week"
    columns:
      - name: refresh_date
        description: "Date when the data was last refreshed"
      - name: term
        description: "Search term (lowercased)"
      - name: country_code
        description: "ISO country code (uppercased)"
      - name: country_name
        description: "Full country name"
      - name: region_code
        description: "Region code within the country (uppercased)"
      - name: region_name
        description: "Region name within the country"
      - name: week
        description: "Week of the search trend data"
      - name: trend_score
        description: "Relative popularity score of the term"
      - name: trend_rank
        description: "Rank of the term within its group"

  - name: stg_intl_top_rising_terms
    description: "Cleaned international top rising search terms by country, region, and week"
    columns:
      - name: refresh_date
        description: "Date when the data was last refreshed"
      - name: term
        description: "Search term (lowercased)"
      - name: country_code
        description: "ISO country code (uppercased)"
      - name: country_name
        description: "Full country name"
      - name: region_code
        description: "Region code within the country (uppercased)"
      - name: region_name
        description: "Region name within the country"
      - name: week
        description: "Week of the search trend data"
      - name: trend_score
        description: "Relative popularity score of the term"
      - name: percent_gain
        description: "Percentage increase in search interest compared to prior period"
      - name: trend_rank
        description: "Rank of the term within its group"
