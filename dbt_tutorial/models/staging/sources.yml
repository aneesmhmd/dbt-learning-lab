version: 2

sources:
  - name: dbt_data
    database: dbt_demo
    schema: warehouse

    tables:
      - name: customers
        description: "Raw customer records"
        columns:
          - name: customer_id
            description: "Primary key"
            tests:
              - unique
              - not_null
          - name: email
            description: "Customer email address"
            tests:
              - unique
              - not_null

      - name: products
        description: "Raw product catalog"
        columns:
          - name: product_id
            description: "Primary key"
            tests:
              - unique
              - not_null

      - name: orders
        description: "Raw orders placed by customers"
        columns:
          - name: order_id
            description: "Primary key"
            tests:
              - unique
              - not_null
          - name: status
            description: "Order status"
            tests:
              - accepted_values:
                  values: ['placed', 'shipped', 'delivered', 'cancelled']

      - name: order_items
        description: "Raw line items for each order"
        columns:
          - name: item_id
            description: "Primary key"
            tests:
              - unique
              - not_null
