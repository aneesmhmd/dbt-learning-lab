version: 2

models:
  - name: serve_country_trend_summary
    description: "One row per country per week summarising trending activity; partitioned by week, clustered by country_code and country_trend_activity"
    columns:
      - name: week
        description: "Week of the search trend data"
      - name: country_code
        description: "ISO country code"
      - name: country_name
        description: "Full country name"
      - name: unique_terms
        description: "Count of distinct rising search terms for the country and week"
      - name: avg_trend_score
        description: "Average trend score across all terms for the country and week"
      - name: max_trend_score
        description: "Highest trend score observed for the country and week"
      - name: avg_percent_gain
        description: "Average percent gain across all rising terms for the country and week"
      - name: max_percent_gain
        description: "Highest percent gain observed for the country and week"
      - name: top_term
        description: "The term ranked #1 by trend score for the country and week"
      - name: top_term_score
        description: "Trend score of the top-ranked term"
      - name: top_term_percent_gain
        description: "Percent gain of the top-ranked term"
      - name: country_trend_activity
        description: "Activity label based on avg percent gain: Highly Active, Active, Moderate, or Low Activity"
      - name: loaded_at
        description: "Timestamp when this row was loaded"

  - name: serve_global_top_terms
    description: "Top 10 trending terms per country per week for the global trends dashboard; partitioned by week, clustered by country_code and term"
    columns:
      - name: week
        description: "Week of the search trend data"
      - name: country_code
        description: "ISO country code"
      - name: country_name
        description: "Full country name"
      - name: region_code
        description: "Region code within the country"
      - name: region_name
        description: "Region name within the country"
      - name: term
        description: "Search term"
      - name: trend_score
        description: "Relative popularity score of the term"
      - name: trend_rank
        description: "Original rank from the source data"
      - name: percent_gain
        description: "Percentage increase in search interest; NULL for stable terms"
      - name: trend_momentum
        description: "Momentum label: Breakout, Rising Fast, Rising, Slow Rise, or Stable"
      - name: trend_strength
        description: "Strength label based on trend score: High, Medium, or Low"
      - name: country_week_rank
        description: "Rank of the term within its country for the given week (only rows <= 10 are included)"
      - name: loaded_at
        description: "Timestamp when this row was loaded"

  - name: serve_rising_vs_stable
    description: "Global trends split into Rising vs Stable with breakout flagging; partitioned by week, clustered by country_code, trend_type, and term"
    columns:
      - name: week
        description: "Week of the search trend data"
      - name: country_code
        description: "ISO country code"
      - name: country_name
        description: "Full country name"
      - name: term
        description: "Search term"
      - name: trend_score
        description: "Relative popularity score of the term"
      - name: percent_gain
        description: "Percentage increase in search interest; NULL for stable terms"
      - name: trend_momentum
        description: "Momentum label: Breakout, Rising Fast, Rising, Slow Rise, or Stable"
      - name: trend_strength
        description: "Strength label based on trend score: High, Medium, or Low"
      - name: trend_type
        description: "Binary classification: Rising or Stable"
      - name: is_breakout
        description: "TRUE if the term has Breakout momentum"
      - name: loaded_at
        description: "Timestamp when this row was loaded"

  - name: serve_us_top_terms
    description: "Top 10 trending terms per US DMA region per week for the US regional trends dashboard; partitioned by week, clustered by dma_id, term, and trend_momentum"
    columns:
      - name: week
        description: "Week of the search trend data"
      - name: dma_id
        description: "Designated Market Area identifier"
      - name: dma_name
        description: "Designated Market Area name"
      - name: term
        description: "Search term"
      - name: trend_score
        description: "Relative popularity score of the term"
      - name: trend_rank
        description: "Original rank from the source data"
      - name: percent_gain
        description: "Percentage increase in search interest; NULL for stable terms"
      - name: trend_momentum
        description: "Momentum label: Breakout, Rising Fast, Rising, Slow Rise, or Stable"
      - name: trend_strength
        description: "Strength label based on trend score: High, Medium, or Low"
      - name: dma_week_rank
        description: "Rank of the term within its DMA for the given week (only rows <= 10 are included)"
      - name: loaded_at
        description: "Timestamp when this row was loaded"
